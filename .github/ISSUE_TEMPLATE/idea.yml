name: Idea
description: Suggest something the app should explain, show or do.
title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste your income, CPF balances, savings, debts or anyone's name here — issues are public.**
        This is an educational tool: it will not recommend banks, agents or products.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to work out?
      description: The question you had, e.g. "can we still buy if one of us changes jobs next year?"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source (if it is about a rule)
      description: A link to HDB, CPF, IRAS, MAS or gov.sg.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not pasted any income, CPF balance, savings, debts or names.
          required: true
