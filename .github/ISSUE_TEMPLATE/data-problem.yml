name: Data problem
description: A block, school, MRT station, rent, map layer or other public data is missing, misplaced or out of date.
title: "[Data] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste your income, CPF balances, savings, debts or anyone's name here — issues are public.**
        The app shows public data as published (see DATA_LICENCES.md); a fix may have to wait for the next data refresh.
  - type: dropdown
    id: layer
    attributes:
      label: What kind of data
      options:
        - Resale transactions / prices
        - HDB block (missing, wrong position, height or year)
        - Rents
        - MRT / future rail
        - Schools / childcare / clinics
        - Other map layer (parks, hawkers, malls, bus, flood points…)
        - Something else
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Town, block and street or the place name.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What the app shows and what it should show.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source link
      description: Where the correct information is published (official page preferred).
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not pasted any income, CPF balance, savings, debts or names.
          required: true
