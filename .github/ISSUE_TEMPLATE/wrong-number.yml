name: Wrong number
description: A price, loan, grant, CPF or other figure in the app looks wrong.
title: "[Wrong number] "
labels: ["wrong-number"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste your income, CPF balances, savings, debts or anyone's name here — issues are public.**
        If the number depends on your household, describe it in round words ("two buyers, both first-timers")
        or use one of the app's sample households instead.
  - type: input
    id: screen
    attributes:
      label: Screen / tab
      description: Where you saw it (e.g. Afford → verdict, Compare → "Over-priced?" row, Plan → CPF & retirement).
    validations:
      required: true
  - type: input
    id: flat
    attributes:
      label: Flat
      description: Town, block and street, flat type (e.g. "Bishan, Blk 123 Bishan St 12, 4-room"). No unit number.
    validations:
      required: true
  - type: input
    id: shown
    attributes:
      label: Number shown
      description: Exactly as the app shows it.
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Number you expected
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source link
      description: An official page (HDB, CPF, IRAS, MAS, gov.sg, data.gov.sg) that shows the right number or rule.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Language (EN / 中文), Simple or Pro mode, the date you looked. Again — no personal figures.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not pasted any income, CPF balance, savings, debts or names.
          required: true
